name: CI and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, validate, e2e, build
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
      # Absolute URL for the link card (store-presence.md); the host GitHub Pages serves from.
      SITE_URL: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (core, levels, narration, ui)
        run: pnpm test
      - name: Levels — schema + solver; negative fixtures must fail
        run: pnpm validate:levels
      - name: Install Playwright browsers
        run: pnpm --filter @moin/moin-moin-moin exec playwright install --with-deps chromium firefox webkit
      - name: E2E against the built app (replay on Chromium, Firefox and WebKit)
        run: pnpm test:e2e
        env:
          PW_ALL_BROWSERS: '1'
      - name: Build for GitHub Pages
        run: pnpm build
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/moin-moin-moin/playwright-report
            apps/moin-domi/playwright-report
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: apps/moin-moin-moin/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v5
